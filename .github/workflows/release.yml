name: Release desktop app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}
      TAURI_PUBLIC_KEY: ${{ vars.TAURI_PUBLIC_KEY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target
      - name: Install Tauri CLI
        run: cargo install tauri-cli --version 2.11.4 --locked
      - name: Build signed updater artifacts
        run: bash rust/packaging/build.sh --target universal-apple-darwin --bundles app,dmg --signed
      - name: Publish release assets
        run: |
          tag="${GITHUB_REF_NAME}"
          archive="$(find rust/target/universal-apple-darwin/release/bundle/macos -name '*.app.tar.gz' -print -quit)"
          signature="${archive}.sig"
          test -n "${archive}" && test -f "${signature}"
          test -n "${TAURI_PUBLIC_KEY}" || { echo "TAURI_PUBLIC_KEY repository variable is required" >&2; exit 1; }
          release_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${tag}/Oga.app.tar.gz"
          released_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p .release
          ARCHIVE_URL="${release_url}" SIGNATURE="$(<"${signature}")" RELEASED_AT="${released_at}" VERSION="${tag#v}" python3 - <<'PY' > .release/latest.json
          import json, os
          platform = {"signature": os.environ["SIGNATURE"], "url": os.environ["ARCHIVE_URL"]}
          print(json.dumps({
              "version": os.environ["VERSION"],
              "notes": "See the release notes for details.",
              "pub_date": os.environ["RELEASED_AT"],
              "platforms": {"darwin-aarch64": platform, "darwin-x86_64": platform},
          }, indent=2))
          PY
          gh release view "${tag}" >/dev/null 2>&1 || gh release create "${tag}" --title "Oga ${tag}" --generate-notes
          gh release upload "${tag}" "${archive}#Oga.app.tar.gz" "${signature}#Oga.app.tar.gz.sig" .release/latest.json --clobber
