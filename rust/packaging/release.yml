# Linux portability and package matrix. Signing, notarization, and publishing stay out.
name: Rust packages

on:
  workflow_dispatch:
  pull_request:
    paths:
      - rust/**
      - .gitignore

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            bubblewrap \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf \
            pkg-config
      - name: Install frontend and Tauri tools
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install trunk --locked
          cargo install tauri-cli --version 2.11.4 --locked
      - name: Check Linux capabilities
        if: runner.os == 'Linux'
        working-directory: rust
        run: bash packaging/linux-portability.sh "${{ matrix.target }}"
      - name: Run the Linux workspace gate
        if: runner.os == 'Linux'
        working-directory: rust
        run: cargo test --workspace --all-features
      - name: Build unsigned packages
        working-directory: rust
        run: cargo tauri build --target "${{ matrix.target }}" --no-sign
      - name: Smoke-test the packaged broker binary
        run: ./rust/packaging/smoke-test.sh "rust/target/${{ matrix.target }}/release/oga-cli"
