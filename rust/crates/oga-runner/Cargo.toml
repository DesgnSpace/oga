[package]
name = "oga-runner"
version.workspace = true
edition.workspace = true

[dependencies]
oga-domain = { path = "../oga-domain" }
oga-providers = { path = "../oga-providers" }
libc = "0.2"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
