[package]
name = "oga-events"
version.workspace = true
edition.workspace = true

[dependencies]
oga-domain = { path = "../oga-domain" }
oga-store = { path = "../oga-store" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = "1"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
