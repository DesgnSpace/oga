[package]
name = "oga-mcp"
version.workspace = true
edition.workspace = true

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
oga-config = { path = "../oga-config" }
oga-context = { path = "../oga-context" }
oga-domain = { path = "../oga-domain" }
oga-http = { path = "../oga-http" }
oga-service = { path = "../oga-service" }
oga-store = { path = "../oga-store" }
oga-routing = { path = "../oga-routing" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "sync", "time"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
